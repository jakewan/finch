version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jakewan/finch/daemon/gen
plugins:
  - local: protoc-gen-go
    out: daemon/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: daemon/gen
    opt: paths=source_relative
