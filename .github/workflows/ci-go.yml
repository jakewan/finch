name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          working-directory: core

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          working-directory: daemon

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          working-directory: mcp

      - name: Test core
        run: cd core && go test ./...

      - name: Test daemon
        run: cd daemon && go test ./...

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: true
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
