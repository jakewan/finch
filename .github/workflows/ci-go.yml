name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Cancel only superseded PR runs; let every main-branch run complete so each
  # main commit keeps a finished CI record (bisect / future release tagging).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token. dorny/paths-filter needs pull-requests:read on PR
# events; the rest need only contents:read for checkout. Without this, a future
# org-wide flip to restricted default token permissions would fail the changes
# gate job and, via needs:, block the required checks (repo-wide merge lock).
permissions:
  contents: read
  pull-requests: read

# Single place to bump these within this workflow. They must stay identical to the pins
# in mise.toml — the "Verify toolchain pins match mise.toml" step below enforces it.
env:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "2.12.2"
  GOVULNCHECK_VERSION: "1.6.0"
  BUF_VERSION: "1.66.1"

jobs:
  # Gate job: detect whether Go- or proto-relevant files changed. This runs on
  # every PR (so the required checks below are never workflow-skipped, which
  # would leave them stuck "Expected" and block merge). When nothing relevant
  # changed, the jobs below are if-skipped, which reports them as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'core/**'
              - 'daemon/**'
              - 'mcp/**'
              - 'proto/**'
              - '**/go.mod'
              - '**/go.sum'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - '.golangci.yml'
              - '.github/workflows/ci-go.yml'
              # The security scan reuses this job's toolchain setup, and mise.toml holds
              # the pins this job asserts against — a change to either must be verified
              # by the gate it feeds, not skipped for touching no Go source.
              - '.github/workflows/security-scan.yml'
              - 'mise.toml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - '.github/workflows/ci-go.yml'

  test-and-lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            daemon/go.sum
            mcp/go.sum

      # These versions are pinned both here and in mise.toml, so local and CI can drift
      # apart silently — and the local `just vuln` check is only trustworthy if they
      # agree. Assert it early, before the expensive steps, and annotate the PR on
      # failure. Collapsing the duplication itself is tracked separately.
      - name: Verify toolchain pins match mise.toml
        run: |
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error file=mise.toml::mise.toml pins $1 $2 but CI uses $3"
              fail=1
            fi
          }
          # Compare against the toolchain actually installed, not the requested string,
          # so a fuzzy or mis-resolved go-version is caught rather than assumed.
          check go \
            "$(grep -oP '^go = "\K[^"]+' mise.toml)" \
            "$(go env GOVERSION | sed 's/^go//')"
          check golangci-lint \
            "$(grep -oP 'golangci-lint" = "\K[^"]+' mise.toml)" \
            "$GOLANGCI_LINT_VERSION"
          check govulncheck \
            "$(grep -oP 'govulncheck" = "\K[^"]+' mise.toml)" \
            "$GOVULNCHECK_VERSION"
          check buf \
            "$(grep -oP '^buf = "\K[^"]+' mise.toml)" \
            "$BUF_VERSION"
          exit $fail

      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Generate protobuf code
        run: buf generate

      # Enforces the go.sum reconciliation CLAUDE.md documents as a manual `just tidy`
      # step. Must run after buf generate: without daemon/gen, tidy prunes the gRPC and
      # protobuf requirements and reports a spurious diff. Cheap, so it fails fast.
      - name: Verify go.mod/go.sum are tidy
        run: |
          go -C core mod tidy -diff
          go -C daemon mod tidy -diff
          go -C mcp mod tidy -diff

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: core

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: daemon

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: mcp

      - name: Test core
        run: cd core && go test ./...

      - name: Test daemon
        run: cd daemon && go test ./...

      - name: Test MCP server
        run: cd mcp && go test ./...

      # Last: the slowest step, so faster signals report first. This is a required
      # check, so a reachable advisory blocks the merge. If one lands with no fix
      # available, the default-branch ruleset's bypass actor is the documented escape —
      # see .claude/rules/ci.md.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v${{ env.GOVULNCHECK_VERSION }}

      - name: Scan core for vulnerabilities
        run: cd core && govulncheck ./...

      - name: Scan daemon for vulnerabilities
        run: cd daemon && govulncheck ./...

      - name: Scan MCP server for vulnerabilities
        run: cd mcp && govulncheck ./...

  proto-check:
    needs: changes
    if: ${{ needs.changes.outputs.proto == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          lint: true
          breaking: false
          pr_comment: false
